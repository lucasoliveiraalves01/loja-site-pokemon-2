      <h1>Contato</h1>
      <p>Mande suas informaçoes e espere o retorno para marcar o dia do seu turismo!!✈️</p>

      <form class="form" action="#">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" />
        </div>
        <div class="campo">
          <label for="Id da pokedex">Id da sua Pokedex</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" />
        </div>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" />
        </div>
        <div class="campo">
          <label for="msg">Mensagem</label>
          <textarea id="msg" name="msg" rows="4" placeholder="Escreva sua mensagem"></textarea>
        </div>
        <button type="submit" class="botao">Enviar</button>
      </form>
    </section>
